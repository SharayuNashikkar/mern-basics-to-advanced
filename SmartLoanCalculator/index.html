<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <h1>Smart Loan Calculator</h1>

        <label>Loan Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter loan amount">

        <label>Annual Interest Rate (%)</label>
        <input type="number" id="interest" placeholder="Enter interest rate">

        <label>Loan Tenure (Years)</label>
        <input type="number" id="years" placeholder="Enter years">

        <button onclick="calculateLoan()">Calculate</button>

        <div class="result">
            <p>Monthly EMI: <span id="emi">₹0</span></p>
            <p>Total Interest: <span id="totalInterest">₹0</span></p>
            <p>Total Amount Payable: <span id="totalPayment">₹0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
